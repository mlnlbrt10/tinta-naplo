name: tinta_naplo
description: Tinta Napló Mobile Flutter client using in-app WebView OAuth2 PKCE and kreta_api.
publish_to: 'none'
version: 2.0.2+17

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  dynamic_color: ^1.7.0
  flutter_animate: ^4.5.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  kreta_api:
    path: ./kreta_api
  package_info_plus: ^8.1.2
  path_provider: ^2.1.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  shared_preferences: ^2.5.6
  sensors_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/tinta_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/tinta_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/tinta_icon.png
    - assets/images/showcase/
