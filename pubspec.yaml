name: tinta_naplo
description: Tinta Napló Mobile Flutter client using in-app WebView OAuth2 PKCE and kreta_api.
publish_to: 'none'
version: 3.1.0+7002

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  dynamic_color: ^1.7.0
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  kreta_api:
    path: ./kreta_api
  package_info_plus: ^8.1.2
  path_provider: ^2.1.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  shared_preferences: ^2.5.6
  sensors_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/useless_fun_facts.json
    - assets/images/tinta_icon.png
    - assets/images/tinta_icon_classic.png
    - assets/images/fityma-icon.png
    - assets/images/showcase/showcase_home.webp
    - assets/images/showcase/showcase_timetable.webp
    - assets/images/showcase/showcase_grades.webp
    - assets/images/showcase/showcase_scholarship.webp
    - assets/images/showcase/showcase_absences.webp
    - assets/images/showcase/showcase_themes.webp
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
