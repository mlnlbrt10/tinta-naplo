name: rekreta_app
description: reKRETA Mobile Flutter client using in-app WebView OAuth2 PKCE and kreta_api.
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  dynamic_color: ^1.7.0
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  kreta_api:
    path: ./kreta_api
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
