name: rekreta_app
description: reKRETA Mobile Flutter client using in-app WebView OAuth2 PKCE and kreta_api.
publish_to: 'none'
version: 1.2.6+8

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  dynamic_color: ^1.7.0
  flutter_animate: ^4.5.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  kreta_api:
    path: ./kreta_api
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1d3549"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icons/icon_normal.png
    - assets/icons/icon_oled.png
    - assets/icons/icon_christmas.png
    - assets/icons/icon_christmas_oled.png
